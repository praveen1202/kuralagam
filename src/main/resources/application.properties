# ─────────────────────────────────────────────────
# Tamil Voice Assistant — Application Configuration
# ─────────────────────────────────────────────────

# Server port (Railway/Render inject PORT automatically)
server.port=${PORT:8080}

# Groq API — inject via environment variable GROQ_API_KEY
# NEVER paste your real key here. Use environment variables.
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.audio.url=https://api.groq.com/openai/v1/audio/transcriptions
groq.model=openai/gpt-oss-120b
groq.audio.model=whisper-large-v3-turbo
groq.max-tokens=1000

# Thymeleaf template settings
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.tamilvoice=INFO
logging.level.root=WARN
# Override path via LOG_FILE if you want logs elsewhere (e.g. a mounted volume in Docker)
logging.file.name=${LOG_FILE:logs/kuralagam.log}

# Phase 1 — Persistent interaction capture (JSON Lines)
# Each voice/text interaction is appended here for offline quality evaluation.
# Override via environment variable: DATA_CAPTURE_PATH=/your/path/interactions.jsonl
data.capture.path=${DATA_CAPTURE_PATH:data/interactions.jsonl}

# Knowledge-base coverage gaps — queries the scheme knowledge base could not
# confidently answer. Review this file periodically to decide what to add to
# schemes.json (verify facts against the portals in scheme-sources.json first).
data.capture.gap-path=${DATA_CAPTURE_GAP_PATH:data/knowledge-gaps.jsonl}

# Redis — backs multi-turn conversation history (e.g. an Upstash free-tier instance).
# Provide the full connection string, e.g. rediss://default:<password>@<host>:<port>
spring.data.redis.url=${REDIS_URL}

# Conversation history limits
conversation.ttl-minutes=30
conversation.max-turns=10

# App metadata
spring.application.name=Tamil Voice Assistant
