# ─────────────────────────────────────────────────
# Tamil Voice Assistant — Application Configuration
# ─────────────────────────────────────────────────

# Server port (Railway/Render inject PORT automatically)
server.port=${PORT:8080}

# Groq API — inject via environment variable GROQ_API_KEY
# NEVER paste your real key here. Use environment variables.
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.audio.url=https://api.groq.com/openai/v1/audio/transcriptions
groq.model=llama-3.3-70b-versatile
groq.audio.model=whisper-large-v3-turbo
groq.max-tokens=1000

# Thymeleaf template settings
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.tamilvoice=INFO
logging.level.root=WARN

# Phase 1 — Persistent interaction capture (JSON Lines)
# Each voice/text interaction is appended here for offline quality evaluation.
# Override via environment variable: DATA_CAPTURE_PATH=/your/path/interactions.jsonl
data.capture.path=${DATA_CAPTURE_PATH:data/interactions.jsonl}

# App metadata
spring.application.name=Tamil Voice Assistant
