<!DOCTYPE html>
<html lang="ta" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>குரலகம் — Kuralagam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;500;600;700&family=Noto+Serif:wght@400;600&family=Inter:wght@400;500;600&display=swap">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* Palette lifted from the Kuralagam Screens design doc. */
            --ground:      #FBF7F0;
            --chrome:      #F6EFE2;
            --footer:      #EDE3CE;
            --surface:     #FFFCF6;
            --field:       #F1E7D4;
            --field-idle:  #E4D7BE;
            --chip:        #F0E8D8;
            --ink:         #1C1410;
            --ink-2:       #6B584C;
            --maroon:      #7B1D2D;
            --saffron:     #C8651B;
            --saffron-ink: #8A4413;
            --jade:        #2D7A5E;
            --rule:        rgba(123, 29, 45, 0.14);
            --rule-soft:   rgba(123, 29, 45, 0.13);
            --tamil:       'Noto Serif Tamil', 'Noto Serif', serif;
            --mono:        ui-monospace, Menlo, Consolas, monospace;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #EDE6DA;
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Shell ────────────────────────────────────────────── */
        .app {
            width: 100%;
            max-width: 520px;
            height: 100dvh;
            max-height: 860px;
            display: flex;
            flex-direction: column;
            background: var(--ground);
            background-image: repeating-linear-gradient(135deg,
                rgba(200,101,27,.055) 0 1px, rgba(0,0,0,0) 1px 10px);
            overflow: hidden;
        }
        @media (min-width: 560px) and (min-height: 880px) {
            .app { border-radius: 24px; box-shadow: 0 18px 60px -30px rgba(28,20,16,.45); }
        }

        /* ── Header ───────────────────────────────────────────── */
        .hdr {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 16px 20px 14px;
            background: var(--chrome);
            border-bottom: 1px solid var(--rule);
            flex: none;
        }
        .seal {
            width: 38px; height: 38px;
            border-radius: 12px;
            background: var(--maroon);
            color: var(--ground);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--tamil);
            font-size: 19px; font-weight: 600;
            flex: none;
        }
        .hdr-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .brand {
            font-family: var(--tamil);
            font-size: 20px; font-weight: 600; line-height: 1;
            letter-spacing: .01em;
        }
        .presence {
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
            font-size: 11.5px;
            color: rgba(28,20,16,.6);
        }
        .lang-ta .presence { font-family: var(--tamil); }
        .presence-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--jade);
            box-shadow: 0 0 0 3px rgba(45,122,94,.18);
            flex: none;
        }
        .app.offline .presence { color: rgba(123,29,45,.85); }
        .app.offline .presence-dot {
            background: var(--saffron);
            box-shadow: 0 0 0 3px rgba(200,101,27,.18);
        }

        /* Language control */
        .lang-wrap { margin-left: auto; position: relative; flex: none; }
        .lang-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 13px;
            border-radius: 12px;
            background: var(--chip);
            border: 1px solid rgba(200,101,27,.4);
            color: var(--saffron-ink);
            font: inherit;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
        }
        .lang-ta .lang-btn { font-family: var(--tamil); }
        .lang-btn[aria-expanded="true"] { border-color: var(--saffron); }
        .lang-btn .globe {
            width: 14px; height: 14px; border-radius: 50%;
            border: 1.5px solid var(--saffron);
            flex: none;
        }
        .lang-btn .caret { font-size: 10px; }
        .lang-btn[aria-expanded="true"] .caret { transform: rotate(180deg); }

        .lang-menu {
            position: absolute;
            right: 0; top: calc(100% + 8px);
            width: 236px;
            background: var(--surface);
            border: 1px solid rgba(123,29,45,.16);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 10px 24px -14px rgba(28,20,16,.3);
            z-index: 20;
        }
        .lang-menu[hidden] { display: none; }
        .lang-menu-label { padding: 7px 10px 9px; font-size: 11.5px; color: var(--ink-2); }
        .lang-opt {
            display: flex; align-items: center; gap: 10px;
            width: 100%;
            padding: 11px 12px;
            border: none;
            border-radius: 11px;
            background: transparent;
            font: inherit;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
        }
        .lang-opt:hover { background: rgba(200,101,27,.06); }
        .lang-opt[aria-checked="true"] { background: rgba(200,101,27,.1); }
        .lang-opt .tick {
            width: 16px; height: 16px; border-radius: 50%;
            border: 1.5px solid rgba(28,20,16,.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: transparent;
            flex: none;
        }
        .lang-opt[aria-checked="true"] .tick {
            background: var(--saffron); border-color: var(--saffron); color: #FFF9F1;
        }
        .lang-opt .name-ta { font-family: var(--tamil); font-size: 15px; }
        .lang-opt .name-en { font-size: 14.5px; }
        .lang-sep { height: 1px; background: rgba(28,20,16,.08); margin: 7px 12px; }
        .lang-soon-label { padding: 2px 12px 7px; font-size: 11px; color: var(--ink-2); }
        .lang-soon { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 12px 10px; }
        .lang-soon span {
            font-size: 13px; padding: 5px 11px;
            border-radius: 9px; background: var(--chip);
            color: rgba(28,20,16,.5);
        }

        /* ── Thread ───────────────────────────────────────────── */
        .thread {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 13px;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .daymark {
            align-self: center;
            font-size: 11.5px;
            letter-spacing: .04em;
            color: rgba(28,20,16,.6);
        }
        .lang-ta .daymark { font-family: var(--tamil); }

        .bubble { max-width: 88%; }
        .bubble.user {
            align-self: flex-end;
            max-width: 80%;
            background: var(--jade);
            color: var(--ground);
            border-radius: 18px 18px 6px 18px;
            padding: 13px 16px;
        }
        .bubble.bot {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--rule-soft);
            border-radius: 18px 18px 18px 6px;
            padding: 15px 17px;
        }
        .bubble.bot.declined {
            border-color: rgba(123,29,45,.22);
            border-left: 3px solid var(--maroon);
        }
        .bubble.stale { opacity: .55; }

        .decline-label {
            font-size: 11.5px;
            letter-spacing: .03em;
            color: var(--maroon);
            margin-bottom: 8px;
        }
        .lang-ta .decline-label { font-family: var(--tamil); }

        .body { font-size: 15px; line-height: 1.75; }
        .body.ta { font-family: var(--tamil); font-size: 15.5px; line-height: 1.85; }
        .body p + p { margin-top: 9px; }
        .body .subhead {
            margin-top: 9px;
            font-size: 13.5px;
            letter-spacing: .03em;
            color: var(--maroon);
        }
        .body ul { margin: 5px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .body li { display: flex; gap: 8px; line-height: 1.5; }
        .body li::before { content: '•'; color: var(--saffron); flex: none; }

        .caret {
            display: inline-block;
            width: 2px; height: 1.05em;
            vertical-align: -2px;
            margin-left: 2px;
            background: var(--saffron);
            animation: ku-blink 1s steps(1, end) infinite;
        }
        @keyframes ku-blink { 0%,45% { opacity: 1; } 55%,100% { opacity: 0; } }
        @keyframes ku-dot {
            0%,60%,100% { transform: translateY(0); opacity: .35; }
            30%         { transform: translateY(-4px); opacity: 1; }
        }

        /* Streaming status row inside a bubble */
        .streamrow {
            display: flex; align-items: center; gap: 7px;
            margin-top: 10px;
            font-size: 10.5px;
            color: var(--saffron);
        }
        .streamrow.done { color: rgba(123,29,45,.8); }
        .streamrow .live {
            width: 5px; height: 5px; border-radius: 50%;
            background: currentColor;
            animation: ku-blink 1.2s ease-in-out infinite;
            flex: none;
        }
        .streamrow.done .live { animation: none; }
        .streamrow .stop {
            margin-left: auto;
            font-size: 11.5px;
            color: var(--maroon);
            background: none; border: none; padding: 0;
            cursor: pointer;
        }
        .lang-ta .streamrow .stop { font-family: var(--tamil); }

        /* Action row: translation pill and source links */
        .actions {
            margin-top: 11px;
            padding-top: 10px;
            border-top: 1px solid rgba(123,29,45,.12);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
        }
        .src-label {
            white-space: nowrap;
            font-size: 11.5px;
            letter-spacing: .04em;
            color: var(--ink-2);
        }
        .lang-ta .src-label { font-family: var(--tamil); }
        .pill {
            display: flex; align-items: center; gap: 7px;
            font-size: 12px;
            color: var(--ink-2);
            padding: 6px 11px;
            border-radius: 9px;
            border: 1px solid rgba(28,20,16,.16);
            background: transparent;
            white-space: nowrap;
            cursor: pointer;
        }
        .lang-ta .pill { font-family: var(--tamil); }
        .pill:hover { background: rgba(200,101,27,.06); }
        .pill .swap { font-family: var(--mono); font-size: 10px; color: var(--saffron-ink); }
        .src {
            display: flex; align-items: center; gap: 6px;
            font-size: 11.5px;
            padding: 6px 10px;
            border-radius: 9px;
            background: var(--ground);
            border: 1px solid rgba(200,101,27,.3);
            color: var(--ink);
            text-decoration: none;
            white-space: nowrap;
        }
        .src::before {
            content: '';
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--saffron);
        }
        .src .out { color: var(--ink-2); font-size: 10px; }

        /* Expanded translation panel — bleeds to the bubble edges */
        .xlate {
            margin: 12px -17px 0;
            padding: 11px 17px 12px;
            border-top: 1px solid rgba(200,101,27,.28);
            background: rgba(240,232,216,.55);
        }
        .xlate[hidden] { display: none; }
        .xlate-head {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 7px;
            font-size: 11.5px;
            color: var(--ink-2);
        }
        .xlate-head .swap { font-family: var(--mono); font-size: 10px; color: var(--saffron-ink); }
        .xlate-head .hide {
            margin-left: auto;
            font-size: 11.5px;
            color: var(--saffron-ink);
            background: none; border: none; padding: 0;
            cursor: pointer;
        }
        .lang-ta .xlate-head .hide { font-family: var(--tamil); }
        .xlate-body { font-size: 13px; line-height: 1.65; color: rgba(28,20,16,.75); }
        .xlate-body.ta { font-family: var(--tamil); font-size: 13.5px; line-height: 1.8; }

        /* Suggestion chips */
        .chips { display: flex; flex-wrap: wrap; gap: 9px; padding-left: 2px; }
        .bubble .chips { margin-top: 13px; padding-left: 0; gap: 8px; }
        .chip {
            font-size: 13.5px;
            padding: 9px 14px;
            border-radius: 14px;
            background: rgba(240,232,216,.9);
            border: 1px solid rgba(200,101,27,.28);
            color: var(--saffron-ink);
            cursor: pointer;
        }
        .lang-ta .chip { font-family: var(--tamil); }
        .chip:hover { background: var(--chip); }
        .bubble .chip { font-size: 13px; padding: 8px 13px; border-radius: 12px; }

        /* Thinking dots */
        .thinking {
            align-self: flex-start;
            display: flex; align-items: center; gap: 9px;
            background: var(--surface);
            border: 1px solid var(--rule-soft);
            border-radius: 16px 16px 16px 5px;
            padding: 11px 15px;
        }
        .thinking i {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--saffron);
            animation: ku-dot 1.1s ease-in-out infinite;
        }
        .thinking i:nth-child(2) { animation-delay: .16s; }
        .thinking i:nth-child(3) { animation-delay: .32s; }
        .thinking span {
            font-size: 12.5px;
            color: rgba(28,20,16,.6);
            margin-left: 4px;
        }
        .lang-ta .thinking span { font-family: var(--tamil); }

        /* Detected-language banner */
        .detect {
            align-self: stretch;
            display: flex; align-items: center; gap: 11px;
            background: rgba(200,101,27,.09);
            border: 1px solid rgba(200,101,27,.35);
            border-radius: 14px;
            padding: 12px 14px;
        }
        .detect .mark {
            width: 22px; height: 22px; border-radius: 50%;
            border: 1.5px solid var(--saffron);
            flex: none;
        }
        .detect .copy { flex: 1; font-size: 12px; line-height: 1.55; color: var(--ink-2); }
        .detect .copy b {
            display: block;
            font-family: var(--tamil);
            font-weight: 400; font-size: 13px;
            color: var(--ink);
        }
        .detect .acts { display: flex; gap: 7px; flex: none; }
        .detect button { font: inherit; font-size: 12px; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
        .detect .yes { background: var(--saffron); color: #FFF9F1; border: none; }
        .detect .no  { background: transparent; border: 1px solid rgba(28,20,16,.2); color: var(--ink); }
        .lang-en .detect .yes, .lang-ta .detect .no { font-family: var(--tamil); font-size: 12.5px; }

        /* Inline network error */
        .errcard {
            align-self: stretch;
            display: flex; align-items: center; gap: 12px;
            background: rgba(123,29,45,.06);
            border: 1px solid rgba(123,29,45,.28);
            border-radius: 14px;
            padding: 13px 15px;
        }
        .errcard .bang {
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--maroon); color: var(--ground);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex: none;
        }
        .errcard .copy { flex: 1; }
        .errcard .copy b {
            display: block;
            font-weight: 400;
            font-size: 13.5px; line-height: 1.6; color: var(--maroon);
        }
        .errcard .copy span {
            font-size: 12px; line-height: 1.55;
            color: rgba(123,29,45,.8);
        }
        .lang-ta .errcard .copy b, .lang-ta .errcard .copy span { font-family: var(--tamil); }
        .errcard button {
            font: inherit;
            font-size: 12.5px;
            padding: 8px 13px; border-radius: 10px;
            background: var(--maroon); color: var(--ground);
            border: none; flex: none; cursor: pointer;
        }
        .lang-ta .errcard button { font-family: var(--tamil); }

        .disclaimer {
            align-self: center;
            margin-top: auto;
            max-width: 82%;
            text-align: center;
            font-size: 11.5px;
            line-height: 1.55;
            color: rgba(28,20,16,.62);
        }
        .lang-ta .disclaimer { font-family: var(--tamil); }

        /* ── Composer ─────────────────────────────────────────── */
        .composer {
            display: flex; align-items: flex-end; gap: 11px;
            padding: 14px 18px;
            border-top: 1px solid var(--rule);
            background: var(--chrome);
            flex: none;
        }
        .field {
            flex: 1;
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(123,29,45,.16);
            border-radius: 16px;
            background: var(--field);
        }
        .field:focus-within {
            background: var(--surface);
            border-color: var(--jade);
            box-shadow: inset 0 0 0 .5px var(--jade);
        }
        .script-hint {
            font-family: var(--mono);
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            background: var(--ground);
            border: 1px solid rgba(28,20,16,.14);
            color: var(--ink-2);
            flex: none;
        }
        .field input {
            flex: 1;
            min-width: 0;
            border: none; outline: none; background: transparent;
            font-family: var(--tamil);
            font-size: 14.5px;
            color: var(--ink);
            padding: 3px 0;
        }
        .lang-en .field input { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
        .field input::placeholder { color: rgba(28,20,16,.5); }

        .icon-btn {
            width: 46px; height: 46px;
            border-radius: 15px;
            border: none;
            display: flex; align-items: center; justify-content: center;
            flex: none;
            cursor: pointer;
        }
        .mic { background: var(--field-idle); color: rgba(28,20,16,.5); }
        .mic svg { width: 20px; height: 20px; }
        .mic.recording { background: var(--maroon); color: var(--ground); }
        .send { background: var(--field-idle); color: rgba(28,20,16,.28); font-size: 17px; }
        .send:enabled { background: var(--jade); color: var(--ground); }
        .send:disabled { cursor: not-allowed; }

        /* ── Footer ───────────────────────────────────────────── */
        .foot {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 20px;
            background: var(--footer);
            border-top: 1px solid rgba(123,29,45,.12);
            font-size: 10.5px;
            color: var(--ink-2);
            flex: none;
        }
        .lang-ta .foot { font-family: var(--tamil); font-size: 11px; }
        .foot-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--jade); flex: none; }
        .app.offline .foot { color: var(--maroon); }
        .app.offline .foot-dot { background: var(--saffron); animation: ku-blink 1.4s ease-in-out infinite; }
        .build { margin-left: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; }
        }
    </style>
</head>
<body>

<div class="app lang-ta" id="app">

    <header class="hdr">
        <div class="seal">கு</div>
        <div class="hdr-text">
            <div class="brand" id="brand">குரலகம்</div>
            <div class="presence"><span class="presence-dot"></span><span id="presenceText">ஆன்லைனில் உள்ளது</span></div>
        </div>

        <div class="lang-wrap">
            <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="globe"></span><span id="langBtnText">தமிழ்</span><span class="caret">▾</span>
            </button>
            <div class="lang-menu" id="langMenu" role="menu" hidden>
                <div class="lang-menu-label" id="langMenuLabel">இடைமுக மொழி</div>
                <button class="lang-opt" type="button" role="menuitemradio" data-lang="ta" aria-checked="true">
                    <span class="tick">✓</span><span class="name-ta">தமிழ்</span>
                </button>
                <button class="lang-opt" type="button" role="menuitemradio" data-lang="en" aria-checked="false">
                    <span class="tick">✓</span><span class="name-en">English</span>
                </button>
                <div class="lang-sep"></div>
                <div class="lang-soon-label" id="langSoonLabel">விரைவில்</div>
                <div class="lang-soon"><span>हिन्दी</span><span>తెలుగు</span><span>ಕನ್ನಡ</span></div>
            </div>
        </div>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>

    <div class="composer">
        <div class="field">
            <span class="script-hint" id="scriptHint">அ / A</span>
            <input type="text" id="input" autocomplete="off" enterkeyhint="send"
                   placeholder="தமிழில் தட்டச்சு செய்யுங்கள்…">
        </div>
        <button class="icon-btn mic" id="micBtn" type="button" title="Speak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="1" width="6" height="11" rx="3"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
        </button>
        <button class="icon-btn send" id="sendBtn" type="button" disabled>➔</button>
    </div>

    <footer class="foot">
        <span class="foot-dot"></span><span id="footText">இணைக்கப்பட்டது</span>
        <span class="build">kuralagam-v1</span>
    </footer>
</div>

<script th:inline="none">
(function () {
    'use strict';

    // ── Chrome strings ────────────────────────────────────────
    // One interface language at a time (design turn 3): every chrome string
    // flips together, and nothing is glossed inline.
    var STRINGS = {
        ta: {
            brand: 'குரலகம்',
            online: 'ஆன்லைனில் உள்ளது',
            offline: 'மீண்டும் இணைக்கிறது',
            langName: 'தமிழ்',

        },
        en: {

            langName: 'English',
            menuLabel: 'Interface language',

            connected: 'Connected',
            disconnected: 'Disconnected — retrying',
            today: 'Today',
            greeting: 'Hello! I am Kuralagam. I help you with the Tamil Nadu government’s Health and Education schemes — the Chief Minister’s Comprehensive Health Insurance Scheme (CMCHIS), free medicines, education scholarships and the mid-day meal scheme. What would you like to know?',
            starters: ['Who can join CMCHIS?', 'Scholarship application', 'Free medicines nearby'],
            declineFollowups: ['CMCHIS eligibility', 'Education scholarships'],
            disclaimer: 'Kuralagam answers questions about Health and Education schemes only.',
            translate: 'Translation',
            hide: 'Hide',
            sourceLabel: 'Source',
            thinking: 'Thinking…',
            streaming: 'Replying',
            stop: 'Stop',
            stopped: 'Stopped',
            outOfScope: 'Outside my scope',
            errTitle: 'Connection problem — no reply came through.',
            errBody: 'Your earlier messages are safe.',
            retry: 'Try again',
            listening: 'Listening…',
            micError: 'Could not reach the microphone.',
            sttError: 'Could not turn that speech into text.',
            speak: 'Speak',
            detectTitle: 'நீங்கள் தமிழில் எழுதினீர்கள்.',
            detectBody: 'Keep the app in English, or switch the interface to Tamil?',
            detectYes: 'தமிழ்',
            detectNo: 'English',
            months: ['January','February','March','April','May','June','July','August','September','October','November','December']

    var LANG_META = {
        ta: { code: 'ta-IN', name: 'Tamil',   swap: 'அ→A' },
        en: { code: 'en-IN', name: 'English', swap: 'A→அ' }
    };

    // The scope marker the model prefixes to an out-of-domain decline.
    // It is a routing signal, never reader-facing text.
    var MARK = '[OFF_TOPIC]';

    // ── State ─────────────────────────────────────────────────
    var uiLang = localStorage.getItem('kuralagam.uiLang') || 'ta';
    if (!STRINGS[uiLang]) uiLang = 'ta';

    // "Once opened, later replies show it too" (design 3c).
    var translateSticky = localStorage.getItem('kuralagam.translate') === 'on';

    var langOffered = false;   // the switch banner is offered once per session
    var streamAbort = null;
    var pendingRetry = null;   // text held for the error card's retry
    var recorder = null;
    var recording = false;
    var speakReplies = false;  // a spoken question earns a spoken answer

    var conversationId = sessionStorage.getItem('kuralagam_conversationId');
    if (!conversationId) {
        conversationId = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(16).slice(2);
        sessionStorage.setItem('kuralagam_conversationId', conversationId);
    }

    function $(id) { return document.getElementById(id); }
    var app = $('app'), thread = $('thread'), input = $('input'), sendBtn = $('sendBtn');

    function t() { return STRINGS[uiLang]; }
    function other(lang) { return lang === 'ta' ? 'en' : 'ta'; }

    // Tamil Unicode block. The composer stays script-agnostic, so what the user
    // actually typed — not the interface setting — decides the reply language.
    function detectLang(text) { return /[\u0B80-\u0BFF]/.test(text) ? 'ta' : 'en'; }

    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }

    function scrollDown() { thread.scrollTop = thread.scrollHeight; }

    // ── Interface language ────────────────────────────────────
    function applyLang() {
        var s = t();
        var offline = app.classList.contains('offline');
        app.className = 'app lang-' + uiLang + (offline ? ' offline' : '');
        document.documentElement.lang = uiLang;
        $('brand').textContent = s.brand;
        $('presenceText').textContent = offline ? s.offline : s.online;
        $('footText').textContent = offline ? s.disconnected : s.connected;
        $('langBtnText').textContent = s.langName;
        $('langMenuLabel').textContent = s.menuLabel;
        $('langSoonLabel').textContent = s.soon;
        $('scriptHint').textContent = uiLang === 'ta' ? 'அ / A' : 'A / அ';
        $('micBtn').title = s.speak;
        input.placeholder = s.placeholder;
        Array.prototype.forEach.call(document.querySelectorAll('.lang-opt'), function (b) {
            b.setAttribute('aria-checked', String(b.getAttribute('data-lang') === uiLang));
        });
        try { localStorage.setItem('kuralagam.uiLang', uiLang); } catch (e) { /* private mode */ }
    }

    function setLang(next) {
        if (next === uiLang || !STRINGS[next]) return;
        uiLang = next;
        applyLang();
        resetThread();
    }

    function closeMenu() {
        $('langMenu').hidden = true;
        $('langBtn').setAttribute('aria-expanded', 'false');
    }

    $('langBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        var opening = $('langMenu').hidden;
        $('langMenu').hidden = !opening;
        $('langBtn').setAttribute('aria-expanded', String(opening));
    });
    $('langMenu').addEventListener('click', function (e) {
        e.stopPropagation();
        var opt = e.target.closest ? e.target.closest('.lang-opt') : null;
        if (!opt) return;
        closeMenu();
        setLang(opt.getAttribute('data-lang'));
    });
    document.addEventListener('click', closeMenu);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

    // ── Connection state ──────────────────────────────────────
    function setOnline(ok) {
        if (app.classList.contains('offline') === !ok) return;
        app.classList.toggle('offline', !ok);
        var s = t();
        $('presenceText').textContent = ok ? s.online : s.offline;
        $('footText').textContent = ok ? s.connected : s.disconnected;
    }
    window.addEventListener('online',  function () { setOnline(true); });
    window.addEventListener('offline', function () { setOnline(false); });

    // ── Opening state ─────────────────────────────────────────
    function resetThread() {
        thread.textContent = '';
        var s = t();
        var now = new Date();
        thread.appendChild(el('div', 'daymark',
            s.today + ' · ' + now.getDate() + ' ' + s.months[now.getMonth()]));

        var intro = makeBotBubble(uiLang);
        intro.setText(s.greeting);
        thread.appendChild(intro.node);
        // The intro's own gloss is the same greeting in the other language.
        intro.setActions(STRINGS[other(uiLang)].greeting, []);

        var chips = el('div', 'chips');
        chips.setAttribute('data-opening', '');
        s.starters.forEach(function (q) { chips.appendChild(makeChip(q)); });
        thread.appendChild(chips);

        var note = el('div', 'disclaimer', s.disclaimer);
        note.setAttribute('data-opening', '');
        thread.appendChild(note);
        scrollDown();
    }

    function makeChip(text) {
        var c = el('button', 'chip', text);
        c.type = 'button';
        c.addEventListener('click', function () { send(text); });
        return c;
    }

    function clearOpeningFurniture() {
        Array.prototype.forEach.call(thread.querySelectorAll('[data-opening]'), function (n) {
            n.remove();
        });
    }

    // ── Message rendering ─────────────────────────────────────
    // Model text is only ever inserted with textContent — never innerHTML.
    function renderBody(container, text, lang) {
        container.className = 'body' + (lang === 'ta' ? ' ta' : '');
        container.textContent = '';
        var list = null;
        text.split('\n').forEach(function (raw) {
            var line = raw.trim();
            if (!line) { list = null; return; }
            if (/^[-*•]\s+/.test(line)) {
                if (!list) { list = el('ul'); container.appendChild(list); }
                list.appendChild(el('li', null, line.replace(/^[-*•]\s+/, '')));
                return;
            }
            list = null;
            // A short line ending in a colon reads as a section heading (design 1b).
            if (line.length < 44 && /[:：]$/.test(line)) {
                container.appendChild(el('div', 'subhead', line.replace(/[:：]$/, '')));
            } else {
                container.appendChild(el('p', null, line));
            }
        });
    }

    function makeBotBubble(replyLang) {
        var node = el('div', 'bubble bot');
        var body = el('div', 'body');
        var xlate = el('div', 'xlate');
        xlate.hidden = true;
        node.appendChild(body);
        node.appendChild(xlate);

        return {
            node: node,
            body: body,

            setText: function (text) { renderBody(body, text, replyLang); },

            markDeclined: function () {
                node.classList.add('declined');
                node.insertBefore(el('div', 'decline-label', t().outOfScope), node.firstChild);
                var chips = el('div', 'chips');
                t().declineFollowups.forEach(function (q) { chips.appendChild(makeChip(q)); });
                node.appendChild(chips);
            },

            // The gloss sits behind its own pill, off by default; the sources
            // sit beside it as ஆதாரம் links (designs 1a–1c, 3c).
            setActions: function (translation, sources) {
                var s = t();
                var actions = el('div', 'actions');

                if (translation) {
                    var glossLang = other(replyLang);
                    var head = el('div', 'xlate-head');
                    head.appendChild(el('span', 'swap', LANG_META[replyLang].swap));
                    head.appendChild(el('span', null, STRINGS[glossLang].langName));
                    var hide = el('button', 'hide', s.hide);
                    hide.type = 'button';
                    head.appendChild(hide);
                    xlate.textContent = '';
                    xlate.appendChild(head);
                    xlate.appendChild(el('div', 'xlate-body' + (glossLang === 'ta' ? ' ta' : ''), translation));

                    var pill = el('button', 'pill');
                    pill.type = 'button';
                    pill.appendChild(el('span', 'swap', LANG_META[replyLang].swap));
                    pill.appendChild(el('span', null, s.translate));

                    var show = function (on) {
                        xlate.hidden = !on;
                        pill.hidden = on;
                        translateSticky = on;
                        try {
                            localStorage.setItem('kuralagam.translate', on ? 'on' : 'off');
                        } catch (e) { /* private mode */ }
                    };
                    pill.addEventListener('click', function () { show(true); });
                    hide.addEventListener('click', function () { show(false); });
                    show(translateSticky);

                    actions.appendChild(pill);
                }

                if (sources && sources.length) {
                    actions.appendChild(el('div', 'src-label', s.sourceLabel));
                    sources.slice(0, 2).forEach(function (src) {
                        var a = el('a', 'src');
                        a.href = src.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.title = src.label || src.host;
                        a.appendChild(el('span', null, src.host));
                        a.appendChild(el('span', 'out', '↗'));
                        actions.appendChild(a);
                    });
                }

                if (actions.children.length) node.appendChild(actions);
            }
        };
    }

    function addUser(text) {
        var node = el('div', 'bubble user');
        node.appendChild(el('div', 'body' + (detectLang(text) === 'ta' ? ' ta' : ''), text));
        thread.appendChild(node);
        scrollDown();
        return node;
    }

    // ── Detected-language banner ──────────────────────────────
    function maybeOfferSwitch(replyLang) {
        if (langOffered || replyLang === uiLang) return;
        langOffered = true;
        var s = t();

        var card = el('div', 'detect');
        card.appendChild(el('span', 'mark'));

        var copy = el('div', 'copy');
        copy.appendChild(el('b', null, s.detectTitle));
        copy.appendChild(document.createTextNode(s.detectBody));
        card.appendChild(copy);

        var acts = el('div', 'acts');
        var yes = el('button', 'yes', s.detectYes);
        var no  = el('button', 'no',  s.detectNo);
        yes.type = no.type = 'button';
        yes.addEventListener('click', function () { card.remove(); setLang(replyLang); });
        no.addEventListener('click',  function () { card.remove(); });
        acts.appendChild(yes);
        acts.appendChild(no);
        card.appendChild(acts);

        thread.appendChild(card);
        scrollDown();
    }

    // ── Inline network error ──────────────────────────────────
    function showError(userNode, text) {
        var s = t();
        pendingRetry = text;
        if (userNode) userNode.classList.add('stale');

        var card = el('div', 'errcard');
        card.appendChild(el('div', 'bang', '!'));
        var copy = el('div', 'copy');
        copy.appendChild(el('b', null, s.errTitle));
        copy.appendChild(el('span', null, s.errBody));
        card.appendChild(copy);

        var retry = el('button', null, s.retry);
        retry.type = 'button';
        retry.addEventListener('click', function () {
            card.remove();
            if (userNode) userNode.classList.remove('stale');
            var again = pendingRetry;
            pendingRetry = null;
            if (again) send(again, userNode);
        });
        card.appendChild(retry);

        thread.appendChild(card);
        scrollDown();
    }

    // ── Send ──────────────────────────────────────────────────
    function refreshSend() { sendBtn.disabled = input.value.trim() === ''; }
    input.addEventListener('input', refreshSend);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
    sendBtn.addEventListener('click', function () { send(); });

    function send(preset, reuseNode) {
        var text = (preset != null ? preset : input.value).trim();
        if (!text || streamAbort) return;

        input.value = '';
        refreshSend();
        clearOpeningFurniture();

        var userNode = reuseNode || addUser(text);
        var replyLang = detectLang(text);
        maybeOfferSwitch(replyLang);

        var s = t();
        var thinking = el('div', 'thinking');
        thinking.appendChild(el('i'));
        thinking.appendChild(el('i'));
        thinking.appendChild(el('i'));
        thinking.appendChild(el('span', null, s.thinking));
        thread.appendChild(thinking);
        scrollDown();

        var controller = new AbortController();
        streamAbort = controller;

        var bot = null, raw = '', sources = [], stopped = false, streamRow = null, settled = false;

        function ensureBubble() {
            if (bot) return;
            thinking.remove();
            bot = makeBotBubble(replyLang);
            thread.appendChild(bot.node);

            streamRow = el('div', 'streamrow');
            streamRow.appendChild(el('span', 'live'));
            streamRow.appendChild(el('span', null, s.streaming));
            var stop = el('button', 'stop', s.stop);
            stop.type = 'button';
            stop.addEventListener('click', function () {
                stopped = true;
                controller.abort();
            });
            streamRow.appendChild(stop);
            bot.node.appendChild(streamRow);
            scrollDown();
        }

        // Strip the scope marker from anything the reader sees.
        function visible(value) {
            var v = value.replace(/^\s+/, '');
            return v.indexOf(MARK) === 0 ? v.slice(MARK.length).replace(/^\s+/, '') : value;
        }

        fetch('/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
                message: text,
                language: LANG_META[replyLang].code,
                languageName: LANG_META[replyLang].name,
                conversationId: conversationId
            })
        }).then(function (res) {
            if (!res.ok || !res.body) throw new Error('chat/stream returned ' + res.status);
            setOnline(true);

            var reader = res.body.getReader();
            var decoder = new TextDecoder();
            var buffer = '';

            function pump() {
                return reader.read().then(function (chunk) {
                    if (chunk.done) return;
                    buffer += decoder.decode(chunk.value, { stream: true });

                    var end;
                    while ((end = buffer.indexOf('\n\n')) !== -1) {
                        var frame = buffer.slice(0, end);
                        buffer = buffer.slice(end + 2);

                        // Per the SSE spec a payload containing newlines arrives as
                        // several data: lines, rejoined with a newline — that is what
                        // keeps the reply and its parenthesised gloss on separate lines.
                        var name = 'token', parts = [];
                        frame.split('\n').forEach(function (line) {
                            if (line.indexOf('event:') === 0) name = line.slice(6).trim();
                            else if (line.indexOf('data:') === 0) parts.push(line.slice(5).replace(/^ /, ''));
                        });
                        var data = parts.join('\n');

                        if (name === 'meta') {
                            try {
                                sources = (JSON.parse(data) || {}).sources || [];
                            } catch (e) { /* metadata is optional */ }
                            continue;
                        }

                        ensureBubble();
                        raw += data;
                        // Only line 1 streams into view — the gloss stays behind its pill.
                        bot.setText(visible(raw).split('\n')[0]);
                        bot.body.appendChild(el('span', 'caret'));
                        scrollDown();
                    }
                    return pump();
                });
            }
            return pump();
        }).then(finish).catch(function (err) {
            if (stopped) { finish(); return; }
            settle();
            thinking.remove();
            if (bot && !raw) bot.node.remove();
            setOnline(false);
            console.error('chat stream failed', err);
            showError(userNode, text);
        });

        function settle() {
            if (streamAbort === controller) streamAbort = null;
        }

        function finish() {
            if (settled) return;
            settled = true;
            settle();
            thinking.remove();

            if (!bot || !raw.trim()) {
                if (bot) bot.node.remove();
                showError(userNode, text);
                return;
            }
            if (streamRow) streamRow.remove();

            var offTopic = raw.replace(/^\s+/, '').indexOf(MARK) === 0;
            var clean = visible(raw).trim();
            var lines = clean.split('\n');
            var reply = (lines[0] || '').trim();

            // Line 2 is the parenthesised gloss (GroqService.splitReply's contract);
            // whatever else came back stays in the body so bullets survive.
            var translation = null, bodyLines = [];
            lines.forEach(function (line, i) {
                var trimmed = line.trim();
                if (i > 0 && translation === null &&
                    trimmed.charAt(0) === '(' && trimmed.charAt(trimmed.length - 1) === ')') {
                    translation = trimmed.slice(1, -1).trim();
                } else {
                    bodyLines.push(line);
                }
            });

            if (offTopic) bot.markDeclined();
            bot.setText(bodyLines.join('\n').trim() || reply);

            if (stopped) {
                var row = el('div', 'streamrow done');
                row.appendChild(el('span', 'live'));
                row.appendChild(el('span', null, s.stopped));
                bot.node.appendChild(row);
            }

            bot.setActions(translation, sources);
            scrollDown();
            if (speakReplies) speak(reply, replyLang);
        }
    }

    // ── Read the reply aloud (Web Speech API) ─────────────────
    function speak(text, lang) {
        if (!text || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var utt = new SpeechSynthesisUtterance(text);
        utt.lang = LANG_META[lang].code;
        utt.rate = 0.95;
        var voices = window.speechSynthesis.getVoices();
        var match = voices.filter(function (v) { return v.lang.indexOf(lang) === 0; })[0]
                 || voices.filter(function (v) { return v.lang.indexOf('IN') !== -1; })[0];
        if (match) utt.voice = match;
        window.speechSynthesis.speak(utt);
    }

    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    }

    // ── Voice input (Groq Whisper) ────────────────────────────
    // Phase 2 designs the voice-first shell; Phase 1 keeps the shipped
    // transcribe path behind a quiet mic in the composer.
    $('micBtn').addEventListener('click', function () {
        if (recording) {
            if (recorder && recorder.state !== 'inactive') {
                recorder.stop();
                recorder.stream.getTracks().forEach(function (tr) { tr.stop(); });
            }
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            flashPlaceholder(t().micError);
            return;
        }

        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            recorder = new MediaRecorder(stream);
            var chunks = [];
            recorder.ondataavailable = function (e) { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstart = function () {
                recording = true;
                $('micBtn').classList.add('recording');
                input.placeholder = t().listening;
            };
            recorder.onstop = function () {
                recording = false;
                $('micBtn').classList.remove('recording');
                input.placeholder = t().placeholder;
                transcribe(new Blob(chunks, { type: 'audio/webm' }));
            };
            recorder.start();
        }).catch(function (err) {
            console.error('microphone unavailable', err);
            flashPlaceholder(t().micError);
        });
    });

    function flashPlaceholder(message) {
        input.placeholder = message;
        setTimeout(function () { input.placeholder = t().placeholder; }, 4000);
    }

    function transcribe(blob) {
        var form = new FormData();
        form.append('audio', blob);
        form.append('language', LANG_META[uiLang].code);

        fetch('/api/transcribe', { method: 'POST', body: form })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!data.success || !data.text) throw new Error(data.error || 'empty transcript');
                speakReplies = true;   // a spoken question earns a spoken answer
                send(data.text);
            })
            .catch(function (err) {
                console.error('transcription failed', err);
                flashPlaceholder(t().sttError);
            });
    }

    // ── Boot ──────────────────────────────────────────────────
    applyLang();
    setOnline(navigator.onLine);
    resetThread();
    refreshSend();
})();
</script>

</body>
</html>
