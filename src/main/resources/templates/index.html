<!DOCTYPE html>
<html lang="ta" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>குரலகம் — Kuralagam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;500;600;700&family=Noto+Serif:wght@400;600&family=Inter:wght@400;500;600&display=swap">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="app lang-ta" id="app">

    <header class="hdr">
        <div class="seal">கு</div>
        <div class="hdr-text">
            <div class="brand" id="brand">குரலகம்</div>
            <div class="presence"><span class="presence-dot"></span><span id="presenceText">ஆன்லைனில் உள்ளது</span></div>
        </div>

        <div class="lang-wrap">
            <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="globe"></span><span id="langBtnText">தமிழ்</span><span class="caret">▾</span>
            </button>
            <div class="lang-menu" id="langMenu" role="menu" hidden>
                <div class="lang-menu-label" id="langMenuLabel">இடைமுக மொழி</div>
                <button class="lang-opt" type="button" role="menuitemradio" data-lang="ta" aria-checked="true">
                    <span class="tick">✓</span><span class="name-ta">தமிழ்</span>
                </button>
                <button class="lang-opt" type="button" role="menuitemradio" data-lang="en" aria-checked="false">
                    <span class="tick">✓</span><span class="name-en">English</span>
                </button>
                <div class="lang-sep"></div>
                <div class="lang-soon-label" id="langSoonLabel">விரைவில்</div>
                <div class="lang-soon"><span>हिन्दी</span><span>తెలుగు</span><span>ಕನ್ನಡ</span></div>
            </div>
        </div>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>

    <div class="composer">
        <div class="field">
            <span class="script-hint" id="scriptHint">அ / A</span>
            <input type="text" id="input" autocomplete="off" enterkeyhint="send"
                   placeholder="தமிழில் தட்டச்சு செய்யுங்கள்…">
        </div>
        <button class="icon-btn mic" id="micBtn" type="button" title="Speak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="1" width="6" height="11" rx="3"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
        </button>
        <button class="icon-btn send" id="sendBtn" type="button" disabled>➔</button>
    </div>

    <footer class="foot">
        <span class="foot-dot"></span><span id="footText">இணைக்கப்பட்டது</span>
        <span class="build">kuralagam-v1</span>
    </footer>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
